name: Publish No.20 v1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.yml"
      - ".release-trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen assets
        shell: bash
        run: |
          set -euo pipefail
          echo "3459e6caac9ca3f6a1fdc8c0b1dee8e0c51683db41e83d67bdf23d038338088e  NO20_PAPER_V0_4.pdf" | sha256sum -c -
          echo "857f7423a9a2c56fd37514bfb47935ae8efac7fbd45e0c76a05083e45e755b54  NO20_RCOTBF_V1_0_0_RELEASE.zip" | sha256sum -c -
          python NO20_RCOTBF_EXACT_V0_3.py --self-test
          python NO20_TAIL_AUDIT_V0_4.py | tee tail_audit.log
          grep -F "TAIL_RATIO_AUDIT_PASS" tail_audit.log

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; leaving it unchanged."
            exit 0
          fi
          cat > RELEASE_NOTES.md <<'EOF'
          Reviewed publication package for:

          **Exact Stationary Residence-Time Laws for Occupancy-Triggered Rotating Bloom-Filter Rings**

          Frozen manuscript SHA-256:
          `3459e6caac9ca3f6a1fdc8c0b1dee8e0c51683db41e83d67bdf23d038338088e`

          Release package SHA-256:
          `857f7423a9a2c56fd37514bfb47935ae8efac7fbd45e0c76a05083e45e755b54`

          Verification:
          - exact kernel self-tests: PASS
          - Windows real-machine audit: PASS
          - 100,000-sample Monte Carlo audit: PASS
          - tail asymptotic audit: PASS
          - independent claim/proof/citation review: PASS
          EOF

          gh release create v1.0.0 \
            NO20_PAPER_V0_4.pdf \
            NO20_RCOTBF_V1_0_0_RELEASE.zip \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "No.20 v1.0.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
